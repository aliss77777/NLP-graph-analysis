[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-graph"
version = "2.0.0b1"
description = "Lexical knowledge graphs for AI search optimization — phrase extraction, clustering, platform ownership"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander Liss" }]
keywords = ["nlp", "knowledge-graph", "community-detection", "phrase-extraction", "geo"]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "python-louvain>=0.16",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "pyarrow>=14",
]

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
llm = []
dev = ["pytest>=7.4"]

[project.scripts]
build-lexical-kg = "nlp_graph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nlp_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
